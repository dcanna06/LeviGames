    <!-- spikes -->
    <path d="M 210 145 L 230 100 L 250 150 Z" fill="#22c55e"/>
    <path d="M 260 140 L 280 90 L 300 148 Z" fill="#22c55e"/>
    <path d="M 315 155 L 335 110 L 352 165 Z" fill="#22c55e"/>
